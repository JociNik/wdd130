<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - White Water Rafting</title>
  <meta name="description"
    content="This page provides general information about the White Water Rafting company and the services it offers.">
  <meta name="author" content="Dalton Niklitschek">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="index">
    <div class="index-hero">
      <img src="images/index-hero.jpg" alt="A large group of people rafting in a river">
      <h1>Welcome to Adventure!</h1>
      <article>
        <p>Ready to get started? Visit our Trips page!</p>
        <a href="trips.html">Trips</a>
      </article>
    </div>

    <section class="features">
      <h2>We work with the highest quality standards</h2>
      <figure>
        <img src="images/instructor.jpg" alt="A man in a boat">
        <figcaption>Instructors</figcaption>
      </figure>
      <figure>
        <img src="images/boats.jpg" alt="A boat">
        <figcaption>Boats</figcaption>
      </figure>
      <figure>
        <img src="images/helmets.jpg" alt="Rafting helmets">
        <figcaption>Safety Equipment</figcaption>
      </figure>
    </section>

    <section class="newsletter-form">
      <p>Sign up for our Newsletter!</p>
      <form>
        <div>
          <div>
            <label class="text-label" for="name">Name</label>
            <input class="text-input" type="text" name="name" id="name" placeholder="Placeholder">
          </div>
          <div>
            <label class="text-label" for="email">Email</label>
            <input class="text-input" type="text" name="email" id="email" placeholder="Placeholder">
          </div>
        </div>
        <div>
          <button type="submit">Sign Up</button>
        </div>
      </form>
    </section>

    <footer>
      <p>© 2026 White Water Rafting | Dalton Niklitschek</p>
      <nav class="socialmedia">
        <a href="https://instagram.com">
          <img src="images/instagram.svg" alt="Instagram Logo">
        </a>
        <a href="https://tiktok.com">
          <img src="images/tiktok-bw.svg" alt="TikTok Logo">
        </a>
        <a href="https://whatsapp.com">
          <img src="images/whatsapp.svg" alt="WhatsApp Logo">
        </a>
      </nav>
    </footer>
  </main>
</body>

</html>
