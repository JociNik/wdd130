<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - White Water Rafting</title>
  <meta name="description"
    content="This page provides contact information and a contact form which the user can submit to ask questions about the company and its services.">
  <meta name="author" content="Dalton Niklitschek">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main class="contact">
    <section class="info">
      <h1>White Water Rafting Company</h1>
      <h2>123 Main River Street</h2>
      <h2>Kolob, California</h2>
      <h2>+1 999 999 9999</h2>
      <h2>info@whitewater.com</h2>
    </section>
    <section class="middle">
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2485.8657030087743!2d-0.12183012300880484!3d51.46062211411902!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sar!4v1791356011196!5m2!1ses-419!2sar"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="contact-form">
        <form>
          <div>
            <label class="text-label" for="name">Name</label>
            <input class="text-input" type="text" name="name" id="name" placeholder="Placeholder">
          </div>
          <div>
            <label class="text-label" for="email">Email</label>
            <input class="text-input" type="text" name="email" id="email" placeholder="Placeholder">
          </div>
          <div class="flex-please">
            <div>
              <label class="text-label" for="purpose">Message Purpose</label>
            </div>
            <div class="radio-group">
              <label><input type="radio" name="purpose" id="purpose1" checked> General
                Inquiry</label>
              <label><input type="radio" name="purpose" id="purpose2"> Reservation Question</label>
              <label><input type="radio" name="purpose" id="purpose3"> Website Suggestion</label>
            </div>

          </div>
          <div>
            <label class="text-label">Message
              <textarea name="message" id="message" placeholder="Type here"></textarea></label>
          </div>
          <div>
            <label><input type="checkbox" name="newsletter" id="newsletter"> Please Subscribe me to
              the monthly newsletter</label>
          </div>
          <div>
            <button type="submit">Get in Touch!</button>
          </div>
        </form>
      </div>
    </section>
    <section class="employees">
      <h2>We Are Here To Serve You</h2>
      <figure>
        <img src="images/stephanie-owner.jpg" alt="Picture of a woman">
        <figcaption>Stephanie - Owner</figcaption>
      </figure>
      <figure>
        <img src="images/john-manager.jpg" alt="Picture of a man">
        <figcaption>John - Manager</figcaption>
      </figure>
      <figure>
        <img src="images/chris-coordinator.jpg" alt="Picture of a man">
        <figcaption>Chris - Travel Coordinator</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p>© 2026 White Water Rafting | Dalton Niklitschek</p>
    <nav class="socialmedia">
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram Logo">
      </a>
      <a href="https://tiktok.com">
        <img src="images/tiktok-bw.svg" alt="TikTok Logo">
      </a>
      <a href="https://whatsapp.com">
        <img src="images/whatsapp.svg" alt="WhatsApp Logo">
      </a>
    </nav>
  </footer>
</body>

</html>
