<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Dalton Niklitschek">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Logo showing a computer with code on it" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li>
                <a href="https://github.com">GitHub</a>
            </li>
            <li>
                <a href="https://git-scm.com">Git</a>
            </li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>I am a paragraph.</p>
        </section>
        <section>
            <h2>Another Heading</h2>
            <p>I am another paragraph.</p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/adelaide-australia/320x200/adelaide-australia-temple-lds-856093-wallpaper.jpg"
            width="200">
    </aside>
    <footer>
        <p>Dalton Niklitschek</p>
    </footer>
</body>

</html>
